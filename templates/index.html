<!DOCTYPE html>
<html>

<head>
    <title>ECC Secure Chat</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ece5dd;
        }

        .main-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .chat-container {
            width: 500px;
            height: 90vh;
            background: white;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        .header {
            background: #075e54;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            list-style: none;
            margin: 0;
            background: #e5ddd5;
        }

        #messages li {
            background: #dcf8c6;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 10px 20px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #1ebe5d;
        }

        .security-panel {
            width: 300px;
            height: 90vh;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            overflow-y: auto;
            display: none;
        }

        .security-panel h3 {
            color: #075e54;
        }

        .security-panel textarea {
            width: 100%;
            height: 90px;
            resize: none;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .top-controls {
            text-align: center;
            margin-top: 15px;
        }

        #toggleECC {
            background: #075e54;
        }

        #toggleECC:hover {
            background: #0a7569;
        }
    </style>
</head>

<body>

<div class="top-controls">
    <button id="toggleECC">Show / Hide ECC Details</button>
</div>

<div class="main-container">

    <div class="chat-container">

        <div class="header">
            ECC Secure Chat
        </div>

        <ul id="messages"></ul>

        <div class="input-area">
            <input type="text" id="message" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

    <div class="security-panel" id="securityPanel">

        <h3>ECC Information</h3>

        <p><b>Public Key 1</b></p>
        <textarea id="publicKey1" readonly></textarea>

        <p><b>Public Key 2</b></p>
        <textarea id="publicKey2" readonly></textarea>

        <p><b>Derived Key</b></p>
        <textarea id="generatedKey" readonly></textarea>

        <p><b>Shared Secret</b></p>
        <textarea id="sharedSecret" readonly></textarea>

        <p><b>Encrypted Message</b></p>
        <textarea id="encryptedMsg" readonly></textarea>

        <p><b>Decrypted Message</b></p>
        <textarea id="decryptedMsg" readonly></textarea>

    </div>

</div>

<script>

const socket = io();

const securityPanel = document.getElementById("securityPanel");

document.getElementById("toggleECC").addEventListener("click", () => {

    if (securityPanel.style.display === "none" ||
        securityPanel.style.display === "") {

        securityPanel.style.display = "block";

    } else {

        securityPanel.style.display = "none";

    }

});

socket.on("connect", () => {
    console.log("Connected");
});

socket.on("message", (data) => {

    const li = document.createElement("li");

    if (data.sender === socket.id) {
        li.textContent = "You: " + data.message;
    } else {
        li.textContent = "Friend: " + data.message;
    }

    document.getElementById("messages").appendChild(li);

    document.getElementById("publicKey1").value =
        data.public_key_1 || "";

    document.getElementById("publicKey2").value =
        data.public_key_2 || "";

    document.getElementById("generatedKey").value =
        data.key || "";

    document.getElementById("sharedSecret").value =
        data.shared_secret || "";

    document.getElementById("encryptedMsg").value =
        data.encrypted || "";

    document.getElementById("decryptedMsg").value =
        data.decrypted || "";

    const messages = document.getElementById("messages");
    messages.scrollTop = messages.scrollHeight;
});

function sendMessage() {

    const msg = document.getElementById("message").value;

    if (msg.trim() !== "") {
        socket.send(msg);
        document.getElementById("message").value = "";
    }
}

</script>

</body>
</html>
